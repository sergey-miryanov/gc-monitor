name: CodSpeed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow CodSpeed to trigger backtest performance analysis to generate
  # initial baseline data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python-version: "3.15"
          cache-prefix: codspeed

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4
        with:
          mode: simulation
          run: poetry run pytest tests/benchmarks --codspeed
