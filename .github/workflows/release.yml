name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml, CHANGELOG.md]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          python-version: "3.15"
          cache-prefix: release

      - name: Build distribution
        run: poetry build

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          verify-metadata: true

      - name: Extract changelog
        id: changelog
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import re, os, tomllib
          tag = os.environ.get("TAG", "")
          if tag.startswith("v"):
              version = tag.lstrip("v")
          else:
              with open("pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["tool"]["poetry"]["version"]
          text = open("CHANGELOG.md").read()
          pattern = rf"## Version {re.escape(version)}.*?\n(.*?)(?=\n## |\Z)"
          match = re.search(pattern, text, re.DOTALL)
          body = match.group(1).strip() if match else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"body<<EOF\n{body}\nEOF\n")

      - name: Validate changelog on PR
        if: github.event_name == 'pull_request'
        run: |
          body="${{ steps.changelog.outputs.body }}"
          if [ -z "$body" ]; then
            echo "ERROR: No changelog section matches the current pyproject.toml version"
            echo "Make sure CHANGELOG.md has a ## Version X.Y.Z entry for the current version"
            exit 1
          fi
          echo "Changelog validated successfully"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
