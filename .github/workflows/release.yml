name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml, CHANGELOG.md]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Skip PyPI upload"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          python-version: "3.15"
          cache-prefix: release

      - name: Build distribution
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          dry-run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) || false }}
          verify-metadata: true

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
