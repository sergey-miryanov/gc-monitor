name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Lint with ruff
        run: |
          poetry run ruff check src

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Type check with mypy
        run: |
          poetry run mypy src

  pyrefly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Type check with pyrefly
        run: |
          poetry run pyrefly check src

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Build distribution
        run: |
          poetry build

      - name: Create reports directory
        run: mkdir -p reports
        shell: bash

      - name: Check Python Entitlements
        if: runner.os == 'macOS'
        run: |
          PYTHON_BIN=$(python -c "import sys; print(sys.executable)")
          echo "Checking entitlements for: $PYTHON_BIN"
          codesign -d --entitlements - "$PYTHON_BIN" || true

      - name: Run tests
        run: |
          poetry run pytest -q --cov=src/gc_monitor --cov-report=xml --cov-report=term-missing --junitxml=reports/tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: reports/tests.xml

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  stresss-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main
      - name: Run stress-tests
        run: |
          poetry run pytest -k "control" -s --count 100
