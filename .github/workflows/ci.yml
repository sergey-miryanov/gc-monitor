name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Lint with ruff
        run: |
          poetry run ruff check src

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Type check with mypy
        run: |
          poetry run mypy src

  pyrefly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Type check with pyrefly
        run: |
          poetry run pyrefly check src

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.15"]
    steps:

      - name: Configure macOS taskport permissions
        if: runner.os == 'macOS'
        run: |
          echo "1. Read"
          id $(whoami)
          sudo security authorizationdb read system.privilege.taskport

          echo "2. Write"
          sudo security authorizationdb write system.privilege.taskport is-developer

          echo "3. Check"
          sudo security authorizationdb read system.privilege.taskport

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Build distribution
        run: |
          poetry build

      - name: Create directories
        run: |
          mkdir -p reports
          mkdir -p .temp
        shell: bash

      - name: Run tests
        run: |
          poetry run pytest -q --basetemp=.temp --cov=src/gcmon --cov-report=xml:coverage-${{ matrix.os }}.xml --cov-report=term-missing --cov-branch --junitxml=reports/tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: reports/tests.xml

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-${{ matrix.os }}.xml

  stress-test:
    if: github.ref_name != 'main' && !startsWith(github.ref_name, 'release/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main
      - name: Create directories
        run: |
          mkdir -p .temp
        shell: bash
      - name: Run stress-tests for control
        run: |
          poetry run pytest --basetemp=.temp -k "control" -s --count 40
      - name: Run stress-tests
        run: |
          poetry run pytest --basetemp=.temp -m stress --count 20
