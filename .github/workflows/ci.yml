name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'poetry'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade poetry

      - name: Install dependencies
        run: |
          poetry install

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
            ~/.local/share/pypoetry
          key: poetry-venv-lint-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-lint-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Lint with ruff
        run: |
          poetry run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'poetry'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade poetry

      - name: Install dependencies
        run: |
          poetry install

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
            ~/.local/share/pypoetry
          key: poetry-venv-typecheck-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-typecheck-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Type check with mypy
        run: |
          poetry run mypy .

      - name: Type check with pyrefly
        run: |
          poetry run pyrefly check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'poetry'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade poetry

      - name: Install dependencies
        run: |
          poetry install

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
            ~/.local/share/pypoetry
          key: poetry-venv-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-test-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Build distribution
        run: |
          poetry build

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests
        run: |
          poetry run pytest -q --cov=src/gc_monitor --cov-report=xml --cov-report=term-missing --junitxml=reports/tests.xml

      - name: Coverage summary
        run: |
          poetry run coverage report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: reports/tests.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
