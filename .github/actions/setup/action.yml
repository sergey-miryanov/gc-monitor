name: Setup Python and Poetry
description: Checkout, setup Python, install Poetry, restore cache, and install dependencies
inputs:
  python-version:
    description: Python version
    required: true
  cache-prefix:
    description: Prefix for cache key
    required: true

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true

    - name: Install Poetry
      run: pipx install poetry
      shell: bash

    - name: Restore Poetry cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.os == 'Windows' && '~\AppData\Local\pypoetry\Cache' || runner.os == 'macOS' && '~/Library/Caches/pypoetry' || '~/.cache/pypoetry' }}
        key: poetry-cache-${{ inputs.cache-prefix }}-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          poetry-cache-${{ inputs.cache-prefix }}-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install dependencies
      run: poetry install --all-groups --all-extras --no-interaction
      shell: bash
