[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gcmon"
version = "0.2.0"
description = "GC Monitor"
readme = "README.md"
license = "MIT"
authors = ["Sergey Miryanov <sergey.miryanov@gmail.com>"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
keywords = ["gc", "garbage-collection", "monitoring", "perfetto", "profiling"]
packages = [
  { include = "gcmon", from = "src" }
]

[tool.poetry.scripts]
gcmon = "gcmon.cli:main"

[tool.poetry.plugins."pyperf.hook"]
gcmon = "gcmon.pyperf.hook:gcmon_hook"

[tool.poetry.dependencies]
python = ">=3.15"
msgspec = "0.21.1"
ddsketch = { version = "^3.0.1", optional = true }
psutil = { version = ">=7.2", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
pyperf = "^2.10.0"
pyrefly = "^1.0"
mypy = "^2.1"
typing-extensions = "^4.15.0"
ruff = "^0.15.0"
numpy = "^2.0"
types-psutil = "^7.2"
twine = "^6.0"
pytest-repeat = "^0.9.4"
perfetto = "0.56.0"

[tool.poetry.urls]
Homepage = "https://github.com/sergey-miryanov/gcmon"
Repository = "https://github.com/sergey-miryanov/gcmon"
Issues = "https://github.com/sergey-miryanov/gcmon/issues"
Documentation = "https://github.com/sergey-miryanov/gcmon#readme"

# =============================================================================
# Type Checking Configuration
# =============================================================================

[tool.pyrefly]
python = "3.15"
preset = "strict"
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
# TODO: remove after 3.15 native support:
search-path = ["./stubs"]

[tool.mypy]
python_version = "3.15"
strict = true
strict_equality_for_none = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
# TODO: remove after 3.15 native support:
mypy_path = "./stubs"

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
markers = [
    "stress: thread-safety stress tests for exporter and control-client pipelines (deselected by default; run with -m stress)",
    "integration: integration tests that drive the Perfetto trace processor binary (deselected by default; run with -m integration)",
]
addopts = "-m 'not stress and not integration'"

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src/gcmon"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
    "pass",
]
fail_under = 80
show_missing = true
skip_covered = true

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"

[tool.poetry.extras]
cmdline = ["psutil"]
stats = ["ddsketch"]
