[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gc-monitor"
version = "0.1.0"
description = "GC Monitor"
readme = "README.md"
license = "MIT"
authors = ["Sergey Miryanov <sergey.miryanov@gmail.com>"]
packages = [
  { include = "gc_monitor", from = "src" }
]

[tool.poetry.scripts]
gc-monitor = "gc_monitor.cli:main"

[tool.poetry.plugins."pyperf.hook"]
gc_monitor = "gc_monitor.pyperf.hook:gc_monitor_hook"

[tool.poetry.dependencies]
python = ">=3.15"
msgspec = "0.21.1"
ddsketch = { version = "^3.0.1", optional = true }
psutil = { version = ">=7.2", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
pyperf = "^2.10.0"
pyrefly = "^1.0"
mypy = "^2.1"
typing-extensions = "^4.15.0"
ruff = "^0.15.0"
numpy = "^2.0"

[tool.poetry.urls]
Homepage = "https://github.com/sergey-miryanov/gc-monitor"

# =============================================================================
# Type Checking Configuration
# =============================================================================

[tool.pyrefly]
python = "3.15"
strict = true
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
# TODO: remove after 3.15 native support:
search-path = ["./stubs"]

[tool.mypy]
python_version = "3.15"
strict = true
strict_equality_for_none = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
# TODO: remove after 3.15 native support:
mypy_path = "./stubs"

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src/gc_monitor"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
    "pass",
]
fail_under = 80
show_missing = true
skip_covered = true

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"

[tool.poetry.extras]
cmdline = ["psutil"]
stats = ["ddsketch"]
